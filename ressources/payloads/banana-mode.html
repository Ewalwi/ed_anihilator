<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Banana Mode</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #ffe135;
        font-family: "Comic Sans MS", "Comic Sans", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .card {
        border: 3px dashed #ffe135;
        padding: 32px 40px;
        border-radius: 16px;
        box-shadow: 0 0 25px rgba(255, 225, 53, 0.5);
        animation: wiggle 1.5s infinite;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 2.5rem;
        letter-spacing: 0.2rem;
      }
      p {
        margin: 0;
        font-size: 1.1rem;
      }
      @keyframes wiggle {
        0%, 100% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(1deg);
        }
        50% {
          transform: rotate(-1deg);
        }
        75% {
          transform: rotate(1.5deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🍌 BANANA MODE 🍌</h1>
      <p>Your system is now 82% more potassium.</p>
    </div>
  </body>
</html>
